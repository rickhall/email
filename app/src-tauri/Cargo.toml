[package]
name = "mail-app"
version = "0.1.0"
edition = "2024"

[lib]
name = "mail_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
anyhow = "1.0.104"
mail-core = { version = "0.1.0", path = "../../crates/mail-core" }
notify-rust = "4.19.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = ["devtools"] }
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tokio = { version = "1.53.3", features = ["time", "sync", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
