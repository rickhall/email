name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # The Tauri crate needs the built frontend (app/dist) to compile; it's built in
      # the bundle job. The tests live in the core and CLI crates.
      - run: cargo test --workspace --exclude mail-app
      # The sync engine against real servers: Dovecot (IMAP) and Mailpit (SMTP) in Docker.
      - name: Server tests
        run: |
          eval "$(test-server/test-server.sh up)"
          cargo test -p mail-core --test server
      - name: Server logs
        if: failure()
        run: docker logs mail-test-dovecot 2>&1 | tail -100; docker logs mail-test-mailpit 2>&1 | tail -50
      # The frontend: plain logic in Node (app/scripts/unit-tests.js), and the UI against its mock
      # backend in the runner's Google Chrome (app/scripts/ui-tests.js).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Frontend tests
        working-directory: app
        run: |
          npm ci
          npm run test:unit
          npm run test:ui

  bundle:
    needs: test
    # Publishing to the "latest" release (below) needs to write to the repository.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on an older Ubuntu so the binaries also run on newer distributions
          # (the artifact has .rpm for Fedora, .deb for Debian/Ubuntu, and an AppImage).
          - os: ubuntu-22.04
            platform: linux
            args: ""
            bundle: target/release/bundle
          - os: macos-latest
            platform: macos
            args: "--target universal-apple-darwin"
            bundle: target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: the version counts the commits.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both architectures for a universal macOS binary.
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Version = major.minor from tauri.conf.json + the number of commits as the patch: the
      # same for a commit on every platform and in local builds (see app/src-tauri/build.rs),
      # and higher with every commit (dnf/rpm and macOS see it as an update). Bump major.minor
      # in tauri.conf.json by hand. Written into the config here for the bundles' metadata.
      - name: Set version
        shell: bash
        run: |
          f=app/src-tauri/tauri.conf.json
          base=$(node -p "require('./$f').version")
          v="${base%.*}.$(git rev-list --count HEAD)"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('$f'));c.version='$v';fs.writeFileSync('$f',JSON.stringify(c,null,2)+'\n')"
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "Building version $v"

      # macOS signing and notarization (https://v2.tauri.app/distribute/sign/macos/): with the
      # APPLE_* secrets set, the Tauri build imports the Developer ID certificate into a
      # temporary keychain, signs, notarizes and staples. Without them (pull requests from
      # forks) the build is unsigned: Tauri takes an empty variable as set, so they're only
      # exported when there.
      - name: Apple signing
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "No Apple secrets: unsigned build"
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$API_PRIVATE_KEY" > "$key"
          {
            echo "APPLE_CERTIFICATE=$CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "APPLE_API_ISSUER=$API_ISSUER"
            echo "APPLE_API_KEY=$API_KEY"
            echo "APPLE_API_KEY_PATH=$key"
          } >> "$GITHUB_ENV"

      - name: Build
        working-directory: app
        run: |
          npm ci
          npm run tauri build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v7
        # The release below is what's for downloading: don't let this service stop it.
        continue-on-error: true
        with:
          name: email-${{ matrix.platform }}-${{ env.APP_VERSION }}
          path: |
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/rpm/*.rpm
            ${{ matrix.bundle }}/appimage/*.AppImage
            ${{ matrix.bundle }}/dmg/*.dmg
          if-no-files-found: ignore

      # Every build of main: its files on the "latest" pre-release, as plain downloads with
      # stable links (artifacts come zipped, need a login, expire, and their download service
      # fails at times). Each platform replaces only its own files there.
      - name: Publish to the latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          BUNDLE: ${{ matrix.bundle }}
        run: |
          shopt -s nullglob
          files=("$BUNDLE"/deb/*.deb "$BUNDLE"/rpm/*.rpm "$BUNDLE"/appimage/*.AppImage "$BUNDLE"/dmg/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then echo "nothing to publish"; exit 0; fi
          # The first build creates the release (both platforms may try at once: one wins).
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --prerelease --target "$GITHUB_SHA" --title "Latest build" \
                 --notes "The newest build of main. Unsigned on Linux; signed and notarized on macOS." \
            || gh release view latest >/dev/null
          for a in $(gh release view latest --json assets --jq '.assets[].name'); do
            case "$PLATFORM:$a" in
              macos:*.dmg | linux:*.deb | linux:*.rpm | linux:*.AppImage) gh release delete-asset latest "$a" --yes ;;
            esac
          done
          gh release upload latest "${files[@]}" --clobber

  # The "latest" tag and notes follow the commit just published.
  release:
    needs: bundle
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Point the latest release at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          v="${base%.*}.$(git rev-list --count HEAD)"
          git push --force origin "$GITHUB_SHA:refs/tags/latest"
          gh release edit latest --prerelease --title "Latest build ($v)" \
            --notes "Version $v, built from ${GITHUB_SHA:0:7}. Unsigned on Linux; signed and notarized on macOS."
