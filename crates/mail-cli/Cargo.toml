[package]
name = "mail-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
keyring = "4.2.0"
mail-core = { version = "0.1.0", path = "../mail-core" }
rpassword = "7.5.4"
rustls-native-certs = "0.8.5"
tokio = { version = "1.53.3", features = ["full"] }
tokio-rustls = "0.26.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "mailsync"
path = "src/main.rs"
