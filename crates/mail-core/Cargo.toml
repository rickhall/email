[package]
name = "mail-core"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.4"
anyhow = "1.0.104"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23.1"
chrono = "0.4.45"
futures = "0.3.34"
hickory-resolver = "0.26.3"
imap-proto = "0.17"
keyring = "4.2.0"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "rustls-native-certs", "hostname", "pool"] }
mail-builder = "0.4"
mail-parser = "0.11.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-rustls = "0.26.6"
tracing = "0.1.44"
